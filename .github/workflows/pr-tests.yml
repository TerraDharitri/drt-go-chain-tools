name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.23.6
        uses: actions/setup-go@v3
        with:
          go-version: 1.23.6
        id: go

      - name: Check out code
        uses: actions/checkout@v3
      - name: Get dependencies
        run: |
          make get-dependencies
      - name: Unit tests
        run: |
          make test
